name: Validate and deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate renderer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate catalog, geometry and source contracts
        run: npm run validate

      - name: Run deterministic visual QA
        run: |
          python scripts/qa_static.py
          python scripts/software_pose_qa.py

      - name: Upload V1.3 QA artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: v1.3-renderer-qa
          if-no-files-found: error
          path: |
            data/catalog.json
            data/authoring-metadata.json
            assets/components/clemens-g2
            assets/components/clemens-95k
            assets/source/web-clemens-g2-source-grounded.png
            assets/source/web-clemens-95k-source-grounded.png
            outputs/comparisons/clemens-g2-23.jpg
            outputs/comparisons/clemens-95k-23.jpg
            outputs/comparisons/clemens-g2-23-v1.3-triptych.jpg
            outputs/comparisons/clemens-95k-23-v1.3-triptych.jpg
            outputs/gallery/pose-clemens-g2-23.jpg
            outputs/gallery/pose-clemens-95k-23.jpg
            outputs/qa/static-qa.json
            outputs/qa/software-pose-qa.json

      - name: Build static Pages site
        if: github.event_name != 'pull_request'
        run: python scripts/build_pages.py

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
