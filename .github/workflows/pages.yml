name: Validate and deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate renderer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for browser QA
        run: python -m playwright install --with-deps chromium

      - name: Validate catalog, geometry and source contracts
        run: npm run validate

      - name: Run deterministic visual QA
        run: |
          python scripts/qa_static.py
          python scripts/software_pose_qa.py

      - name: Run browser and WebGL QA
        run: python scripts/browser_qa.py

      - name: Upload V1.4 QA artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: v1.4-renderer-qa
          if-no-files-found: error
          path: |
            data/catalog.json
            data/authoring-metadata.json
            assets/components
            assets/source/web-*-source-grounded.png
            outputs/comparisons/*.jpg
            outputs/gallery/*.jpg
            outputs/qa/*.png
            outputs/qa/*.json

      - name: Build static Pages site
        if: github.event_name != 'pull_request'
        run: python scripts/build_pages.py

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
